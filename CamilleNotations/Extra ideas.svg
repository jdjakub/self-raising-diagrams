    <rect id="Extra-ideas" serif:id="Extra ideas" x="0" y="0" width="883" height="1080" style="fill:none;"/>
    <g id="Extra-ideas1" serif:id="Extra ideas">
        <g transform="matrix(24,0,0,24,437.816,58.068)">
        </g>
        <text x="32px" y="58.068px" style="font-family:'HelveticaNeue-Bold', 'Helvetica Neue';font-weight:700;font-size:24px;">Insert play/pause and r<tspan x="294.68px 308.456px " y="58.068px 58.068px ">es</tspan>et buttons</text>
        <g transform="matrix(24,0,0,24,507.008,374.068)">
        </g>
        <text x="32px" y="374.068px" style="font-family:'HelveticaNeue-Bold', 'Helvetica Neue';font-weight:700;font-size:24px;">Display the state of an ongoing animation</text>
        <g transform="matrix(1,0,0,1,4.54747e-13,-359)">
            <text x="32px" y="453.136px" style="font-family:'HelveticaNeue', 'Helvetica Neue';font-size:24px;">The script may insert (1) a play/pause button and (2) a r<tspan x="622.832px 635.72px " y="453.136px 453.136px ">es</tspan>et button that</text>
            <g transform="matrix(24,0,0,24,821.528,477.808)">
            </g>
            <text x="32px" y="477.808px" style="font-family:'HelveticaNeue', 'Helvetica Neue';font-size:24px;">let users contr<tspan x="184.472px 198.248px " y="477.808px 477.808px ">ol</tspan> the animation (by setting the appr<tspan x="569.936px 583.712px " y="477.808px 477.808px ">op</tspan>riate event handlers).</text>
        </g>
        <g transform="matrix(1,0,0,1,6.82121e-13,-33)">
            <text x="32px" y="453.136px" style="font-family:'HelveticaNeue', 'Helvetica Neue';font-size:24px;">The script may automatically update the SVG so as to display the curr<tspan x="780.632px 793.52px " y="453.136px 453.136px ">en</tspan>t</text>
            <text x="32px" y="477.808px" style="font-family:'HelveticaNeue', 'Helvetica Neue';font-size:24px;">animation state. This may help users understand how the animation rules</text>
            <text x="32px" y="502.48px" style="font-family:'HelveticaNeue', 'Helvetica Neue';font-size:24px;">ar<tspan x="52.448px 65.336px " y="502.48px 502.48px ">e </tspan>interpr<tspan x="140.912px 153.8px " y="502.48px 502.48px ">et</tspan>ed (for<tspan x="228.032px 234.704px " y="502.48px 502.48px ">, </tspan>e.g., lear<tspan x="334.256px 347.6px " y="502.48px 502.48px ">ni</tspan>ng and debugging).</text>
            <text x="32px" y="539.152px" style="font-family:'HelveticaNeue', 'Helvetica Neue';font-size:24px;">It also fully embraces</text>
            <text x="265.808px" y="539.152px" style="font-family:'HelveticaNeue-Italic', 'Helvetica Neue';font-style:italic;font-size:24px;">the view</text>
            <text x="354.248px" y="539.152px" style="font-family:'HelveticaNeue', 'Helvetica Neue';font-size:24px;">: any animation could be shar<tspan x="669.92px 682.808px " y="539.152px 539.152px ">ed</tspan> at any point</text>
            <text x="32px" y="563.824px" style="font-family:'HelveticaNeue', 'Helvetica Neue';font-size:24px;">in time by exporting it as SVG and r<tspan x="412.088px 424.976px " y="563.824px 563.824px ">es</tspan>umed by loading the exported SVG</text>
            <text x="32px" y="588.496px" style="font-family:'HelveticaNeue', 'Helvetica Neue';font-size:24px;">(which would include markers that encode pr<tspan x="513.416px 527.192px 540.968px 548.528px 561.416px " y="588.496px 588.496px 588.496px 588.496px 588.496px ">ogres</tspan>s, which would need to</text>
            <g transform="matrix(24,0,0,24,619.232,613.168)">
            </g>
            <text x="32px" y="613.168px" style="font-family:'HelveticaNeue', 'Helvetica Neue';font-size:24px;">be interpr<tspan x="134.696px 147.584px " y="613.168px 613.168px ">et</tspan>ed by the appr<tspan x="311.216px 324.992px " y="613.168px 613.168px ">op</tspan>riate vector vision engine).</text>
        </g>
        <g transform="matrix(24,0,0,24,440.768,807.068)">
        </g>
        <text x="32px" y="807.068px" style="font-family:'HelveticaNeue-Bold', 'Helvetica Neue';font-weight:700;font-size:24px;">Assign labels to gr<tspan x="243.488px 258.152px " y="807.068px 807.068px ">ou</tspan>ps of elements</text>
        <g transform="matrix(1,0,0,1,6.82121e-13,400)">
            <text x="32px" y="453.136px" style="font-family:'HelveticaNeue', 'Helvetica Neue';font-size:24px;">In or<tspan x="79.568px 93.8px " y="453.136px 453.136px ">de</tspan>r to animate a gr<tspan x="282.296px 296.072px " y="453.136px 453.136px ">ou</tspan>p of elements, an alter<tspan x="548.576px 561.92px " y="453.136px 453.136px ">na</tspan>tive to labelling every</text>
            <text x="32px" y="477.808px" style="font-family:'HelveticaNeue', 'Helvetica Neue';font-size:24px;">SVG element of the gr<tspan x="268.496px 282.272px " y="477.808px 477.808px ">ou</tspan>p would be to intr<tspan x="483.656px 497.432px " y="477.808px 477.808px ">od</tspan>uce “explicit” gr<tspan x="681.896px 695.672px " y="477.808px 477.808px ">ou</tspan>ps of</text>
            <g transform="matrix(24,0,0,24,758.792,502.48)">
            </g>
            <text x="32px" y="502.48px" style="font-family:'HelveticaNeue', 'Helvetica Neue';font-size:24px;">elements, as opposed to “implicit” SVG gr<tspan x="484.112px 497.888px " y="502.48px 502.48px ">ou</tspan>ps (which ar<tspan x="640.568px 653.456px " y="502.48px 502.48px ">e </tspan>invisible).</text>
        </g>
